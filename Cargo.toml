[package]
name = "trit-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "三值决策状态机 + Minecraft 角色托管：Reflex 层高频，Unknown 一律弃权"
license = "MIT"
repository = "https://github.com/bfxh/trit-agent"

# 刻意零依赖：只用 std，任何机器 `cargo build` 都能出二进制。
[dependencies]

[[bin]]
name = "trit-agent"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
