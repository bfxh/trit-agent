name: 认领一条战法
description: 往战法层加一条新的《孙子兵法》/三十六计翻译（只调权重，不新增行为）
title: "[strategy] "
labels: ["strategy", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        战法层在 [`src/strategy.rs`](../blob/main/src/strategy.rs)。
        三条硬约束，写在文件头，别破坏它们：

        1. **不新增行为** —— 战法只加权 / 压票，不改别人投的票
        2. **只用追加票** —— 裁决器是加权求和 + 未知吸收，追加高权重弃权票就能压住动作
        3. **一次只生效一条** —— 两条同时生效必然互相抵消

  - type: input
    id: name
    attributes:
      label: 战法名
      placeholder: 半渡而击
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 出处
      placeholder: 孙子兵法·行军篇
    validations:
      required: true

  - type: textarea
    id: judgment
    attributes:
      label: 判据（什么局面下用它）
      description: |
        必须只依赖 `WorldView` 里已有的字段，且**未知时不启用**。
        现有字段：hp / threat / contact / dist / hazard / enemies / stuck / pos / dead。
        需要新字段的话先说为什么，别默默加。
    validations:
      required: true

  - type: textarea
    id: action
    attributes:
      label: 动作（追加哪些票、权重多少）
      description: 写成「通道 + 方向 + 权重」的形式。要能说清为什么这个权重压得过谁。
      placeholder: |
        Forward  Zero  权重 5   （站住，压过 patrol 的前进票 3）
        Strafe   ±Pos  权重 3
    validations:
      required: true

  - type: textarea
    id: conflict
    attributes:
      label: 它和现有战法在哪种局面会同时命中
      description: |
        这是最容易翻车的地方。第一版「兵贵神速」写 `d <= 12`，结果和「距离带站住」
        直接对冲，角色在 4~5 格反复抖动。说清重叠区间，以及谁该优先。
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 自检
      options:
        - label: 判据里没有把「未知」当「安全」或「安全到可以激进」
          required: true
        - label: 我说明它和现有 5 条战法的重叠区间，并确定优先级
          required: true
        - label: 我会带上「命中 / 不命中 / 未知数据」三种情况的测试
          required: true
